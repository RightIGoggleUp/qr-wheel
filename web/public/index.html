<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter to Win</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0A0A0F; color: #F5F5F7;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100dvh; display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  .wrap { width: 100%; max-width: 500px; padding: 20px 24px; display: flex; flex-direction: column; height: 100%; }
  .brand { text-align: center; color: #6E6E7A; font-size: 17px; margin-bottom: 4vh; }
  h1 { font-size: 48px; font-weight: 800; letter-spacing: -0.5px; }
  .sub { color: #9B9BA6; font-size: 20px; margin-top: 12px; margin-bottom: 4vh; }
  label { display: block; font-size: 18px; font-weight: 700; margin: 2.4vh 0 10px; }
  input {
    width: 100%; height: 64px; background: #15151D; border: 1px solid #23232E;
    border-radius: 16px; padding: 0 18px; color: #F5F5F7; font-size: 19px; outline: none;
  }
  input::placeholder { color: #5A5A66; }
  input:focus { border-color: #E5484D; }
  .error { color: #E5484D; font-size: 16px; margin-top: 16px; min-height: 20px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 64px; margin-top: 3vh; border: none; border-radius: 32px;
    background: #E5484D; color: #fff; font-size: 21px; font-weight: 800; letter-spacing: 0.4px;
    cursor: pointer; box-shadow: 0 10px 34px rgba(229,72,77,0.35);
    text-decoration: none;
  }
  .btn:active { background: #C93A3F; }
  .btn[disabled] { opacity: 0.6; }
  .fine { color: #6E6E7A; font-size: 15px; text-align: center; margin-top: 2.4vh; line-height: 1.5; }
  #success { display: none; text-align: center; margin: auto 0; }
  .check { width: 130px; height: 130px; margin: 0 auto 34px; }
  #form { display: flex; flex-direction: column; height: 100%; }
  #form .fine { margin-top: auto; padding-bottom: 1vh; }
  .fieldblock { flex-shrink: 0; }
  #success h1 { text-align: center; }
  #success .sub { text-align: center; margin-bottom: 0; }
  #success .fine { margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand" id="brand">anotherpatkreation.com</div>

  <form id="form" novalidate>
    <h1>Enter to Win</h1>
    <p class="sub">Fill this out for a chance at today's prize</p>

    <label for="name">Full name</label>
    <input id="name" name="name" type="text" placeholder="Jane Smith" autocomplete="name" required>

    <label for="email">Work email</label>
    <input id="email" name="email" type="email" placeholder="jane@company.com" autocomplete="email" required>

    <label for="sells">What do you sell?</label>
    <input id="sells" name="sells" type="text" placeholder="e.g. software, services">

    <div class="error" id="error"></div>
    <button class="btn" id="submit" type="submit">Submit</button>
    <p class="fine">One entry per person. We'll only use your info for this event.</p>
  </form>

  <div id="success">
    <svg class="check" viewBox="0 0 110 110" fill="none">
      <circle cx="55" cy="55" r="52" stroke="#22C55E" stroke-width="4"/>
      <path d="M34 56 L49 71 L78 40" stroke="#22C55E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>You're in!</h1>
    <p class="sub" id="thanks">You're entered to win.<br>Tap below to see what we're about.</p>
    <a class="btn" id="visitBtn" href="#" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Visit Our Site
    </a>
    <p class="fine">Watch your email - winners are announced by email.</p>
  </div>
</div>

<script>
(async function () {
  try {
    const res = await fetch("/api/config");
    const cfg = await res.json();
    if (cfg.link) {
      document.getElementById("visitBtn").href = cfg.link;
    } else {
      document.getElementById("visitBtn").style.display = "none";
    }
    try { document.getElementById("brand").textContent = new URL(location.href).hostname; } catch (_) {}
  } catch (_) {}
})();

document.getElementById("form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const errEl = document.getElementById("error");
  const btn = document.getElementById("submit");
  errEl.textContent = "";
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const sells = document.getElementById("sells").value.trim();
  if (!name) { errEl.textContent = "Please add your name."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = "That email doesn't look right."; return; }
  btn.disabled = true;
  btn.textContent = "Submitting…";
  try {
    const res = await fetch("/api/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, sells }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "failed");
    document.getElementById("thanks").innerHTML =
      "Thanks, " + name.split(" ")[0].replace(/[<>&]/g, "") +
      ". You're entered to win.<br>Tap below to see what we're about.";
    document.getElementById("form").style.display = "none";
    document.getElementById("success").style.display = "block";
    window.scrollTo(0, 0);
  } catch (err) {
    errEl.textContent = "Something went wrong - please try again.";
    btn.disabled = false;
    btn.textContent = "Submit";
  }
});
</script>
</body>
</html>
