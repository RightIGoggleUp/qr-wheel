name = "qrwheel"
compatibility_date = "2025-06-01"
main = "worker.js"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "qrwheel"
database_id = "REPLACE_ON_DEPLOY"

# Secrets to set at deploy time (wrangler secret put ...):
#   ADMIN_TOKEN   - bearer token for admin endpoints + the Android app
#   BREVO_API_KEY - Brevo API key (optional; route rejected by Patrick - kept as dormant fallback)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET - Gmail API OAuth client (the live route: gmail.send)
# Vars to set below or in the dashboard:
[vars]
SENDER_EMAIL = ""
SENDER_NAME = "Another Pat Kreation"
